# Squid Proxy Configuration for AI Agent Network Isolation
# Purpose: Allow only whitelisted domains for AI coding agents

# =============================================================================
# NETWORK CONFIGURATION
# =============================================================================

# Listen on port 3128 on all interfaces
http_port 3128

# =============================================================================
# ACCESS CONTROL LISTS (ACLs)
# =============================================================================

# Standard ACLs
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16

# SSL ports that CONNECT method can use
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl Safe_ports port 22          # ssh (for git)
acl CONNECT method CONNECT

# Load allowlisted domains from external file
# This file contains one domain per line (with leading .)
acl allowed_domains dstdomain "/etc/squid/allowlist.txt"

# =============================================================================
# ACCESS RULES
# =============================================================================

# Deny requests to unsafe ports
http_access deny !Safe_ports

# Deny CONNECT to non-SSL ports
http_access deny CONNECT !SSL_ports

# Allow localhost (for health checks)
http_access allow localhost

# Allow access only to allowlisted domains from internal network
http_access allow localnet allowed_domains

# Deny everything else
http_access deny all

# =============================================================================
# HTTPS/SSL HANDLING
# =============================================================================

# For HTTPS, we use CONNECT tunneling (no SSL interception)
# This means we can filter by domain but not inspect content
# This is simpler and doesn't require CA certificate management

# =============================================================================
# CACHING
# =============================================================================

# Cache directory (256MB, 16 L1 dirs, 256 L2 dirs)
cache_dir ufs /var/spool/squid 256 16 256

# Maximum object size to cache
maximum_object_size 100 MB

# Memory cache
cache_mem 64 MB

# =============================================================================
# LOGGING
# =============================================================================

# Log format for audit trail
logformat audit %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt

# Access log - records all requests for auditing
access_log daemon:/var/log/squid/access.log audit

# Cache log
cache_log /var/log/squid/cache.log

# Store log
cache_store_log none

# =============================================================================
# PRIVACY & SECURITY
# =============================================================================

# Don't forward internal client IP
forwarded_for delete

# Hide Squid version
httpd_suppress_version_string on

# =============================================================================
# PERFORMANCE
# =============================================================================

# DNS settings
dns_v4_first on
dns_timeout 30 seconds

# Connection settings
connect_timeout 60 seconds
read_timeout 15 minutes

# Shutdown timeout
shutdown_lifetime 5 seconds

# =============================================================================
# ERROR PAGES
# =============================================================================

# Deny info for blocked requests
deny_info ERR_ACCESS_DENIED allowed_domains
