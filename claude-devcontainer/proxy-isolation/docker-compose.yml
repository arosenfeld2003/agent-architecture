# Docker Compose for Network-Isolated AI Agent Environment
# Uses internal Docker network + Squid proxy sidecar for network isolation
# Works with Docker Desktop 4.38+ (no NET_ADMIN capabilities required)

services:
  # Squid proxy - acts as the only gateway to external networks
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: agent-proxy
    networks:
      - isolated
      - external
    ports:
      - "3128:3128"  # Expose for debugging; remove in production
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./proxy/allowlist.txt:/etc/squid/allowlist.txt:ro
      - proxy-cache:/var/spool/squid
      - proxy-logs:/var/log/squid
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3128"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Claude Code agent container
  claude:
    build:
      context: ./agent
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-America/Los_Angeles}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
    container_name: claude-agent
    networks:
      - isolated
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      # Proxy configuration - all HTTP/HTTPS traffic routed through proxy
      - HTTP_PROXY=http://proxy:3128
      - HTTPS_PROXY=http://proxy:3128
      - http_proxy=http://proxy:3128
      - https_proxy=http://proxy:3128
      # Git uses these for HTTPS operations
      - GIT_SSL_NO_VERIFY=false
      # No proxy for local communications
      - NO_PROXY=localhost,127.0.0.1,proxy
      - no_proxy=localhost,127.0.0.1,proxy
      # Node.js options
      - NODE_OPTIONS=--max-old-space-size=4096
      # Claude config
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      # API key — set ANTHROPIC_API_KEY in your shell or .env file
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEVCONTAINER=true
      # Shell customization
      - POWERLEVEL9K_DISABLE_GITSTATUS=true
    volumes:
      - claude-bashhistory:/commandhistory
      - claude-config:/home/node/.claude
      - ${WORKSPACE_PATH:-./../workspace}:/workspace:delegated
      # Filesystem permissions config (read-only so agent cannot modify it)
      - ${PERMISSIONS_FILE:-./agent/permissions.json}:/etc/agent-permissions.json:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
    # No NET_ADMIN or NET_RAW capabilities needed!

networks:
  # Internal network - no external access
  isolated:
    internal: true
    driver: bridge
  # External network - only proxy connects here
  external:
    driver: bridge

volumes:
  proxy-cache:
  proxy-logs:
  claude-bashhistory:
  claude-config:
